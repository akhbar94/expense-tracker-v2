<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111322">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Expense Tracker">
  <link rel="manifest" href="./manifest.json">
  <title>☕ Expense Tracker</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111322;
      overflow: hidden;
    }

    body {
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      background: #111322;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111322;
      color: white;
      font-size: 16px;
      font-weight: 700;
      transition: opacity .25s ease;
    }

    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="loading">☕ Loading Expense Tracker...</div>

  <iframe
    id="appFrame"
    title="☕ Expense Tracker"
    src="https://script.google.com/macros/s/AKfycbzIFGn8GQA1bi9w-WMpIX37w8xS3ScdLwRRHMiOHbX_3M4N668kBoTQPSEiwZDRxj9Q/exec??v=20261006-1955"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <script>
    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loading');

    frame.addEventListener('load', () => {
      setTimeout(() => loading.classList.add('hide'), 150);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(console.error);
      });
    }
  </script>

</body>
</html>
